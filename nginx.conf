http {
    limit_req_zone $binary_remote_addr zone=one:10m rate=90r/m;

    upstream forum-api {
        server localhost:3000;
    }

    server {
        listen 80;
        listen 443 ssl;

        location /threads {
            limit_req zone=one;
            proxy_pass http://forum-api;
        }

        location / {
            proxy_pass http://forum-api;
        }
    }
}