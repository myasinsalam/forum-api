name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: supersecretpassword
          POSTGRES_DB: forumapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run migrations
        run: npm run migrate:test up
        env:
          PGHOST: localhost
          PGUSER: developer
          PGDATABASE: forumapi_test
          PGPASSWORD: supersecretpassword
          PGPORT: 5432

      - name: Run tests
        run: npm test
        env:
          PGHOST: localhost
          PGUSER: developer
          PGDATABASE: forumapi_test
          PGPASSWORD: supersecretpassword
          PGPORT: 5432
          ACCESS_TOKEN_KEY: ${{ secrets.ACCESS_TOKEN_KEY }}
          REFRESH_TOKEN_KEY: ${{ secrets.REFRESH_TOKEN_KEY }}
          ACCCCESS_TOKEN_AGE: 3000

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Railway
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { deploymentTrigger(input: { serviceId: \"a5267495-61a9-4df6-9266-2797c06508e9\", environmentId: \"b1aa8d4d-e03d-4f38-b695-8b28efd7f6d2\" }) { id } }"}' \
            https://backboard.railway.com/graphql/v2